server {
    listen 80;
    server_name admin-astoria.com.br admin-astoria.local;

    location / {
        proxy_pass http://admin:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name chocosul.com.br www.chocosul.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name chocosul.com.br www.chocosul.com.br;

    ssl_certificate /etc/letsencrypt/live/chocosul.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chocosul.com.br/privkey.pem;

    location /stylesheets/ {
        alias /opt/apps/astoria/apps/Chocosul/stylesheets/;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://chocosul:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name mastter.com.br mastter.local;

    location / {
        proxy_pass http://mastter:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80 default_server;
    server_name _;

    location / {
        return 404;
    }
}