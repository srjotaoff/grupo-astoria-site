server {
    listen 80;
    server_name admin-astoria.com.br admin-astoria.local;

    resolver 127.0.0.11 valid=10s;
    set $admin_upstream http://admin:3001;

    location / {
        proxy_pass $admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name chocosul.com.br www.chocosul.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name chocosul.com.br www.chocosul.com.br;

    ssl_certificate /etc/letsencrypt/live/chocosul.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chocosul.com.br/privkey.pem;

    resolver 127.0.0.11 valid=10s;
    set $chocosul_upstream http://chocosul:3002;

    location /stylesheets/ {
        alias /opt/apps/astoria/apps/Chocosul/stylesheets/;
        try_files $uri =404;
    }

    location /images/ {
        alias /opt/apps/astoria/apps/Chocosul/images/;
        try_files $uri =404;
    }

    set $admin_upstream_ssl http://admin:3001;

    location /admin/ {
        rewrite ^/admin/(.*)$ /$1 break;
        proxy_pass $admin_upstream_ssl;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin {
        return 301 /admin/;
    }

    location / {
        proxy_pass $chocosul_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name mastter.com.br www.mastter.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mastter.com.br www.mastter.com.br;

    ssl_certificate /etc/letsencrypt/live/mastter.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mastter.com.br/privkey.pem;

    resolver 127.0.0.11 valid=10s;
    set $mastter_upstream http://mastter:3003;

    # Serve Mastter static assets (including @font-face fonts under
    # /stylesheets/fontes/) directly from nginx, bypassing the app's CORS
    # layer that returns 500 on same-origin font requests carrying an Origin
    # header. Same fix already applied to the Chocosul site above.
    location /stylesheets/ {
        alias /opt/apps/astoria/apps/Mastter/stylesheets/;
        try_files $uri =404;
    }

    location /images/ {
        alias /opt/apps/astoria/apps/Mastter/images/;
        try_files $uri =404;
    }

    set $adminmastter_upstream_path http://admin-mastter:3004;

    location /admin/ {
        rewrite ^/admin/(.*)$ /$1 break;
        proxy_pass $adminmastter_upstream_path;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin {
        return 301 /admin/;
    }

    location / {
        proxy_pass $mastter_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
