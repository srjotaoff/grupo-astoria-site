services:
  chocosul:
    build:
      context: .
      dockerfile: dockerfile
    container_name: chocosul-site
    ports:
      - "8080:80"
    volumes:
      - ./app/public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

