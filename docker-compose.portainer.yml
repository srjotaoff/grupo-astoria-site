services:
  admin:
    build:
      context: ${PROJECT_PATH:-/opt/grupo-astoria-site}
      dockerfile: Dockerfile
    container_name: astoria-admin
    working_dir: /workspace
    command: npm run dev:admin
    env_file:
      - ${PROJECT_PATH:-/opt/grupo-astoria-site}/.env
    environment:
      NODE_ENV: development
      APP_NAME: admin
      PORT_ADMIN: 3001
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ${PROJECT_PATH:-/opt/grupo-astoria-site}:/workspace
      - admin_node_modules:/workspace/node_modules
    expose:
      - "3001"
    restart: unless-stopped
    networks:
      - astoria-net

  chocosul:
    build:
      context: ${PROJECT_PATH:-/opt/grupo-astoria-site}
      dockerfile: Dockerfile
    container_name: astoria-chocosul
    working_dir: /workspace
    command: npm run dev:chocosul
    env_file:
      - ${PROJECT_PATH:-/opt/grupo-astoria-site}/.env
    environment:
      NODE_ENV: development
      APP_NAME: chocosul
      PORT_CHOCOSUL: 3002
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ${PROJECT_PATH:-/opt/grupo-astoria-site}:/workspace
      - chocosul_node_modules:/workspace/node_modules
    expose:
      - "3002"
    restart: unless-stopped
    networks:
      - astoria-net

  mastter:
    build:
      context: ${PROJECT_PATH:-/opt/grupo-astoria-site}
      dockerfile: Dockerfile
    container_name: astoria-mastter
    working_dir: /workspace
    command: npm run dev:mastter
    env_file:
      - ${PROJECT_PATH:-/opt/grupo-astoria-site}/.env
    environment:
      NODE_ENV: development
      APP_NAME: chocosul
      PORT_CHOCOSUL: 3003
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ${PROJECT_PATH:-/opt/grupo-astoria-site}:/workspace
      - mastter_node_modules:/workspace/node_modules
    expose:
      - "3003"
    restart: unless-stopped
    networks:
      - astoria-net

  admin-mastter:
    build:
      context: ${PROJECT_PATH:-/opt/grupo-astoria-site}
      dockerfile: Dockerfile
    container_name: astoria-admin-mastter
    working_dir: /workspace
    command: npm run dev:admin-mastter
    env_file:
      - ${PROJECT_PATH:-/opt/grupo-astoria-site}/.env
    environment:
      NODE_ENV: development
      APP_NAME: admin-mastter
      PORT_ADMIN_MASTTER: 3004
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ${PROJECT_PATH:-/opt/grupo-astoria-site}:/workspace
      - admin_mastter_node_modules:/workspace/node_modules
    expose:
      - "3004"
    restart: unless-stopped
    networks:
      - astoria-net

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: astoria-cloudbeaver
    expose:
      - "8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    restart: unless-stopped
    networks:
      - astoria-net

  nginx:
    image: nginx:1.27-alpine
    container_name: astoria-nginx
    depends_on:
      - admin
      - chocosul
      - mastter
      - admin-mastter
      - cloudbeaver
    ports:
      - "80:80"
      - "3009:3009"
    volumes:
      - ${PROJECT_PATH:-/opt/grupo-astoria-site}/infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${PROJECT_PATH:-/opt/grupo-astoria-site}/apps/Chocosul/stylesheets:/opt/apps/astoria/apps/Chocosul/stylesheets:ro
      - ${PROJECT_PATH:-/opt/grupo-astoria-site}/apps/Chocosul/images:/opt/apps/astoria/apps/Chocosul/images:ro
      - ${PROJECT_PATH:-/opt/grupo-astoria-site}/apps/Mastter/stylesheets:/opt/apps/astoria/apps/Mastter/stylesheets:ro
      - ${PROJECT_PATH:-/opt/grupo-astoria-site}/apps/Mastter/images:/opt/apps/astoria/apps/Mastter/images:ro
    restart: unless-stopped
    networks:
      - astoria-net

networks:
  astoria-net:
    driver: bridge

volumes:
  admin_node_modules:
  chocosul_node_modules:
  mastter_node_modules:
  admin_mastter_node_modules:
  cloudbeaver_data:

