<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Administração</title>
    <link rel="stylesheet" href="stylesheets/reset.css">
    <link rel="stylesheet" href="stylesheets/portal_adm_acesso.css">

    <link rel="icon" type="image/svg+xml" href="images/icones/icone_chocosul.svg">

</head>
<body>
<header>

</header>

<main>
    <div id="main_unico">
        <div id="main_unico_caixa_imagem">
            <img src="images/logo_chocosul.svg" alt="">
        </div>
        <div id="main_unico_caixa">

            <div>
                <label>Usuário:</label>
                <input id="cpf" type="text" placeholder="CPF">
            </div>

            <div>
                <label>Senha:</label>
                <input id="senha" type="password" placeholder="Senha">
            </div>
            <button id="acessar-btn"><p>ACESSAR </p><img src="images/icones/icone_seta_direita_branco.svg" alt=""></button>
            <p id="error-msg" style="color:red;font-size:0.85rem;min-height:1.2em;"></p>
        </div>
        <p id="main_unico_informacao">Acesso ao portal de administração do site</p>

    </div>
</main>
<script src="javascripts/login_adm.js"></script>
</body>
</html>
