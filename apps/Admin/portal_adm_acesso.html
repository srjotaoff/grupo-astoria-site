<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Administração</title>
    <link rel="stylesheet" href="stylesheets/reset.css">
    <link rel="stylesheet" href="stylesheets/portal_adm_acesso.css">
    <link rel="icon" type="image/svg+xml" href="images/imagens_icones/icone_chocosul.svg">
</head>
<body>
<header></header>

<main>
    <div id="main_unico">
        <div id="main_unico_caixa_imagem">
            <img src="images/imagens_grandes/logo_chocosul.svg" alt="Logo Chocosul">
        </div>
        <div id="main_unico_caixa">
            <div>
                <label for="cpf">Usuário (CPF):</label>
                <input id="cpf" type="text" placeholder="000.000.000-00" autocomplete="username">
            </div>
            <div>
                <label for="senha">Senha:</label>
                <input id="senha" type="password" placeholder="Sua senha" autocomplete="current-password">
            </div>
            <p id="error-msg"></p>
            <button id="acessar-btn" type="button">
                <p>ACESSAR</p>
                <img src="images/imagens_setas/icone_seta_direita_branco.svg" alt="">
            </button>
        </div>
        <p id="main_unico_informacao">Acesso ao portal de administração do site</p>
    </div>
</main>

<script defer src="javascripts/login_adm.js"></script>
</body>
</html>
