<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Suporte</title>
    <link rel="stylesheet" href="stylesheets/reset.css">
    <link rel="stylesheet" href="stylesheets/solicitar_suporte.css">
    <link rel="stylesheet" href="stylesheets/header.css">
    <link rel="icon" type="image/svg+xml" href="images/icones/icone_chocosul.svg">

    <script defer src="utils.js"></script>
    <script defer src="javascripts/header.js"></script>
    <script defer src="javascripts/solicitar_suporte.js"></script>
</head>
<body>
<header>
</header>

<main class="main_index">
    <div id="main_painel">
        <p id="main_painel_titulo">Solicitar Suporte</p>
        <div id="main_painel_formulario">
            <div id="main_painel_formulario_setor">
            </div>
            <div id="main_painel_formulario_opcoes">
                <div id="main_painel_formulario_opcoes_lista">
                </div>
                <textarea id="main_painel_formulario_opcoes_texto"></textarea>
            </div>
            <div id="main_painel_formulario_botoes">
                <div id="main_painel_formulario_botoes_anexo">
                    <label id="main_painel_formulario_botoes_anexo_label" for="main_painel_formulario_botoes_anexo_input">Anexar arquivo</label>
                    <input id="main_painel_formulario_botoes_anexo_input" type="file">
                </div>
                <button id="main_painel_formulario_botoes_salvar">Salvar solicitação</button>
            </div>
            <div id="main_painel_formulario_alerta">
                <p></p>
            </div>
        </div>
    </div>
</main>

<footer>
</footer>
</body>
</html>
