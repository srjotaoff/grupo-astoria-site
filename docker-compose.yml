services:
  admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astoria-admin-dev
    command: npm run dev:admin
    env_file:
      - .env
    environment:
      NODE_ENV: development
      APP_NAME: admin
      PORT_ADMIN: 3001
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./:/workspace
      - admin_node_modules:/workspace/node_modules
    expose:
      - "3001"
    restart: unless-stopped
    networks:
      - astoria-net

  chocosul:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astoria-chocosul-dev
    command: npm run dev:chocosul
    env_file:
      - .env
    environment:
      NODE_ENV: development
      APP_NAME: chocosul
      PORT_CHOCOSUL: 3002
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./:/workspace
      - chocosul_node_modules:/workspace/node_modules
    expose:
      - "3002"
    restart: unless-stopped
    networks:
      - astoria-net

  mastter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astoria-mastter-dev
    command: npm run dev:mastter
    env_file:
      - .env
    environment:
      NODE_ENV: development
      APP_NAME: chocosul
      PORT_CHOCOSUL: 3003
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./:/workspace
      - mastter_node_modules:/workspace/node_modules
    expose:
      - "3003"
    restart: unless-stopped
    networks:
      - astoria-net

  nginx:
    image: nginx:1.27-alpine
    container_name: astoria-nginx-dev
    depends_on:
      - admin
      - chocosul
      - mastter
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - astoria-net

networks:
  astoria-net:
    driver: bridge

volumes:
  admin_node_modules:
  chocosul_node_modules:
  mastter_node_modules:

