services:
  admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astoria-admin-dev
    command: npm run dev:admin
    env_file:
      - .env
    environment:
      NODE_ENV: development
      APP_NAME: admin
      PORT_ADMIN: 3001
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./:/workspace
      - admin_node_modules:/workspace/node_modules
    expose:
      - "3001"
    restart: unless-stopped
    networks:
      - astoria-net
    ports:
      - "3001:3001"

  chocosul:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astoria-chocosul-dev
    command: npm run dev:chocosul
    env_file:
      - .env
    environment:
      NODE_ENV: development
      APP_NAME: chocosul
      PORT_CHOCOSUL: 3002
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./:/workspace
      - chocosul_node_modules:/workspace/node_modules
    expose:
      - "3002"
    restart: unless-stopped
    networks:
      - astoria-net
    ports:
      - "3002:3002"

  mastter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astoria-mastter-dev
    command: npm run dev:mastter
    env_file:
      - .env
    environment:
      NODE_ENV: development
      APP_NAME: chocosul
      PORT_CHOCOSUL: 3003
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./:/workspace
      - mastter_node_modules:/workspace/node_modules
    expose:
      - "3003"
    restart: unless-stopped
    networks:
      - astoria-net
    ports:
      - "3003:3003"

  admin-mastter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astoria-admin-mastter-dev
    command: npm run dev:admin-mastter
    env_file:
      - .env
    environment:
      NODE_ENV: development
      APP_NAME: admin-mastter
      PORT_ADMIN_MASTTER: 3004
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./:/workspace
      - admin_mastter_node_modules:/workspace/node_modules
    expose:
      - "3004"
    restart: unless-stopped
    networks:
      - astoria-net
    ports:
      - "3004:3004"

  mysql:
    image: mysql:8.0
    container_name: astoria-mysql
    command: --max_allowed_packet=67108864
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: users
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - astoria-net
    restart: unless-stopped
    ports:
      - "3306:3306"

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: astoria-cloudbeaver-dev
    expose:
      - "8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    restart: unless-stopped
    networks:
      - astoria-net

  nginx:
    image: nginx:1.27-alpine
    container_name: astoria-nginx-dev
    depends_on:
      - admin
      - chocosul
      - mastter
      - admin-mastter
      - cloudbeaver
    ports:
      - "80:80"
      - "443:443"
      - "3009:3009"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./apps/Chocosul/stylesheets:/opt/apps/astoria/apps/Chocosul/stylesheets:ro
      - ./apps/Chocosul/images:/opt/apps/astoria/apps/Chocosul/images:ro
    restart: unless-stopped
    networks:
      - astoria-net

networks:
  astoria-net:
    driver: bridge

volumes:
  admin_node_modules:
  chocosul_node_modules:
  mastter_node_modules:
  admin_mastter_node_modules:
  mysql_data:
  cloudbeaver_data:

